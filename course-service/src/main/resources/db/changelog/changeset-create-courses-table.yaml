databaseChangeLog:
  - changeSet:
      id: create-courses-table
      author: student

      changes:
        - createTable:
            tableName: courses

            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: text

              - column:
                  name: teacher_name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: duration_hours
                  type: int

              - column:
                  name: price
                  type: numeric(10,2)

              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false