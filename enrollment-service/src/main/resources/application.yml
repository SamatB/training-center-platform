server:
  port: 8083

spring:
  application:
    name: enrollment-service

  datasource:
    url: jdbc:postgresql://localhost:5435/enrollment_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml