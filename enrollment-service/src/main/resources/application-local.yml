spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/enrollment_db
    username: postgres
    password: postgres
  kafka:
    bootstrap-servers: localhost:9092
  cloud:
    openfeign:
      client:
        config:
          user-service:
            url: http://localhost:8081
          course-service:
            url: http://localhost:8082
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: host.docker.internal
    prefer-ip-address: false