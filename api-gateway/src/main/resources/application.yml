spring:
  application:
    name: api-gateway

  cloud:                                    # ????????? Spring Cloud
    gateway:                                # ????????? API Gateway
      server:                               # ????????? Gateway-???????
        webflux:                            # ?????????? ?????????? WebFlux Gateway
          routes:                           # ?????? ????????? Gateway
            - id: course-service            # ?????????? ??? ????????
              uri: lb://course-service      # ???? ????????? ??????: ????? course-service ????? Eureka
              predicates:                   # ???????, ??? ??????? ????????? ???????
                - Path=/api/v1/courses/**   # ??? ??????? ?? ????? ???? ?????????? ? course-service

          globalcors:
            cors-configurations:
              '[/**]':                      # CORS ??????????? ?? ???? ????? Gateway.
                allowedOrigins:             # ????????? ??????????? frontend ? localhost:5173.
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:             # ????????? ????????? ???????, ? ??? ????? Authorization.
                  - "*"
                allowCredentials: true      # ????????? credentials ??? cross-origin ????????.

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/