spring:
  application:
    name: api-gateway

  cloud:                                    # ????????? Spring Cloud
    gateway:                                # ????????? API Gateway
      server:                               # ????????? Gateway-???????
        webflux:                            # ?????????? ?????????? WebFlux Gateway
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**

            - id: course-service
              uri: lb://course-service
              predicates:
                - Path=/api/v1/courses/**

            - id: enrollment-service
              uri: lb://enrollment-service
              predicates:
                - Path=/api/v1/enrollments/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**

            - id: document-service
              uri: lb://document-service
              predicates:
                - Path=/api/documents/**

          globalcors:
            cors-configurations:
              '[/**]':                      # CORS ??????????? ?? ???? ????? Gateway.
                allowedOrigins:             # ????????? ??????????? frontend ? localhost:5173.
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:             # ????????? ????????? ???????, ? ??? ????? Authorization.
                  - "*"
                allowCredentials: true      # ????????? credentials ??? cross-origin ????????.

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/