server:
  port: 8084

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5436/notification_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username:  ${MAIL_USERNAME}
    password:  ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: notification-service #имя Consumer Group
      auto-offset-reset: earliest #если у этой группы ещё нет offset, читать с начала

      #преобразует key из байтов обратно в String
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      #преобразует JSON обратно в Java-объект
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.training.notificationservice.event.EnrollmentCreatedEvent

app:
  kafka:
    topics:
      enrollment-created: enrollments.created

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/



