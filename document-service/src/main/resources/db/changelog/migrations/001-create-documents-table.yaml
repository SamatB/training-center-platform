databaseChangeLog:
  - changeSet:
      id: 001-create-documents-table
      author: student
      changes:
        - createTable:
            tableName: documents
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: enrollment_id
                  type: UUID
              - column:
                  name: payment_id
                  type: UUID
              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: documents
            indexName: idx_documents_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: documents
            indexName: idx_documents_enrollment_id
            columns:
              - column:
                  name: enrollment_id

        - createIndex:
            tableName: documents
            indexName: idx_documents_payment_id
            columns:
              - column:
                  name: payment_id
