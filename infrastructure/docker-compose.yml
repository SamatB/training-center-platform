services:

  discovery-service:
    image: ghcr.io/samatb/discovery-service:ci
    container_name: discovery-service
    ports:
      - "8761:8761"

  api-gateway:
    image: ghcr.io/samatb/api-gateway:ci
    container_name: api-gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - discovery-service

  user-service:
    image: ghcr.io/samatb/user-service:ci
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres:5432/user_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: training-kafka:29092
    ports:
      - "8081:8081"
    depends_on:
      - user-postgres
      - discovery-service
      - kafka

  course-service:
    image: ghcr.io/samatb/course-service:ci
    container_name: course-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://course-postgres:5432/course_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      - course-postgres
      - discovery-service

  enrollment-service:
    image: ghcr.io/samatb/enrollment-service:ci
    container_name: enrollment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://enrollment-postgres:5432/enrollment_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: training-kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    ports:
      - "8083:8083"
    depends_on:
      - enrollment-postgres
      - discovery-service
      - kafka

  auth-service:
    image: ghcr.io/samatb/auth-service:ci
    container_name: auth-service
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-postgres:5432/auth_db
      EUREKA_URL: http://discovery-service:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: training-kafka:29092
    ports:
      - "8085:8085"
    depends_on:
      - auth-postgres
      - discovery-service
      - kafka

  payment-service:
    image: ghcr.io/samatb/payment-service:ci
    container_name: payment-service
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://payment-postgres:5432/payment_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    ports:
      - "8086:8086"
    depends_on:
      - payment-postgres
      - discovery-service

  notification-service:
    image: ghcr.io/samatb/notification-service:ci
    container_name: notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-postgres:5432/notification_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: training-kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8084:8084"
    depends_on:
      - notification-postgres
      - discovery-service
      - kafka

  document-service:
    image: ghcr.io/samatb/document-service:ci
    container_name: document-service
    environment:
      DOCUMENT_DB_URL: jdbc:postgresql://document-postgres:5432/document_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    ports:
      - "8087:8087"
    depends_on:
      - document-postgres
      - discovery-service

  user-postgres:
    image: postgres:16
    container_name: user-postgres
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data

  course-postgres:
    image: postgres:16
    container_name: course-postgres
    environment:
      POSTGRES_DB: course_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - course-postgres-data:/var/lib/postgresql/data

  enrollment-postgres:
    image: postgres:16
    container_name: enrollment-postgres
    environment:
      POSTGRES_DB: enrollment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - enrollment-postgres-data:/var/lib/postgresql/data

  notification-postgres:
    image: postgres:16
    container_name: notification-postgres
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data

  auth-postgres:
    image: postgres:16
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data\

  payment-postgres:
    image: postgres:16
    container_name: payment-postgres
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"
    volumes:
      - payment_db-postgres-data:/var/lib/postgresql/data

  document-postgres:
      image: postgres:16
      container_name: document-postgres
      environment:
        POSTGRES_DB: document_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5439:5432"
      volumes:
        - document_db-postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.1
    container_name: training-kafka
    ports:
      - "9092:9092"
    environment:
      # Уникальный ID этого узла Kafka внутри кластера.
      # Если Kafka-сервер один — достаточно 1.
      KAFKA_NODE_ID: 1

      # Какие роли выполняет этот узел:
      # broker — принимает, хранит и отдаёт сообщения;
      # controller — управляет метаданными Kafka-кластера.
      # У нас один контейнер выполняет обе роли.
      KAFKA_PROCESS_ROLES: broker,controller

      # На каких внутренних портах Kafka принимает соединения.
      # 9092 — приложения (Producer/Consumer) общаются с broker.
      # 9093 — служебное взаимодействие controller.
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT_DOCKER://:29092,CONTROLLER://:9093

      # Адрес, который Kafka сообщает клиентам:
      # "подключайтесь ко мне через localhost:9092".
      # Наши Spring Boot сервисы запускаются локально из IntelliJ,
      # поэтому для них Kafka действительно находится на localhost.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://training-kafka:29092

      # Говорим Kafka, какой listener предназначен для controller.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Указываем протокол для каждого listener.
      # PLAINTEXT означает обычное соединение без SSL/TLS.
      # Для локальной учебной среды этого достаточно.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT

      # Список controller'ов KRaft-кластера.
      # Формат: nodeId@host:port
      # У нас один controller:
      # nodeId = 1, адрес = localhost, порт = 9093.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Системный topic __consumer_offsets хранит offset'ы Consumer Group.
      # В production обычно есть несколько реплик.
      # У нас один broker → replication factor должен быть 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Количество реплик внутренних данных Kafka Transactions.
      # Один broker → ставим 1.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      # Минимальное количество синхронизированных реплик,
      # необходимое Kafka Transactions.
      # Один broker → только 1.
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: training-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: training-center
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: training-kafka:29092
    depends_on:
      - kafka

volumes:
  user-postgres-data:
  course-postgres-data:
  enrollment-postgres-data:
  notification-postgres-data:
  auth-postgres-data:
  payment_db-postgres-data:
  document_db-postgres-data: