server:
  port: 8085

spring:
  application:
    name: auth-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5437/auth_db}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml


  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  jwt:
    secret: ${JWT_SECRET:VHJhaW5pbmdDZW50ZXJQbGF0Zm9ybUpXVFNlY3JldEtleTIwMjZTYW1hdFNlY3VyZUtleQ==}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}

  kafka:
    topics:
      user-registered: user.registered